<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zpěvník — české říkanky s akordy</title>
<meta name="theme-color" content="#b4532a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#fff8ef; --card:#fffdf9; --ink:#2b2118; --muted:#8a7460;
    --accent:#b4532a; --accent-soft:#f6e3d5; --green:#2f6f4e;
    --line:#e8d8c6; --shadow:0 2px 10px rgba(94,63,33,.08);
    --lyrics-size: 20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(255,248,239,.96);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
  }
  .head-row{display:flex;align-items:center;gap:10px}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1}
  h1 span{color:var(--accent)}
  .icon-btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:12px; height:40px; min-width:40px; padding:0 12px; font-size:14px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .icon-btn:active{transform:scale(.97)}
  .search{margin-top:10px;display:flex;gap:8px}
  .search input{
    flex:1; height:44px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); padding:0 14px; font-size:16px; color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;border:1px solid var(--line);background:var(--card);
    color:var(--muted);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  main{padding:12px 16px 40px;max-width:900px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;
    cursor:pointer;box-shadow:var(--shadow);position:relative;transition:transform .12s
  }
  .card:active{transform:scale(.985)}
  .card h3{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:-.2px}
  .card .first{color:var(--muted);font-size:13px;line-height:1.35;margin-bottom:10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;color:var(--muted);background:#f4eadf;border-radius:6px;padding:3px 7px}
  .song-chords{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
  .song-chords b{font-size:12px;color:var(--green);font-weight:700}
  .fav{position:absolute;top:10px;right:10px;font-size:18px;line-height:1;opacity:.25;
    background:none;border:0;cursor:pointer;padding:4px}
  .fav.on{opacity:1}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:15px}

  /* detail */
  .detail{display:none}
  .detail.open{display:block}
  .list-wrap.hidden{display:none}
  .back{margin-bottom:14px}
  .song-head{display:flex;gap:12px;align-items:flex-start}
  .song-head h2{margin:0;font-size:26px;letter-spacing:-.5px;line-height:1.15;flex:1}
  .song-sub{color:var(--muted);font-size:13px;margin-top:4px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px;align-items:center}
  .transpose{display:flex;align-items:center;gap:0;border:1px solid var(--line);
    border-radius:12px;overflow:hidden;background:var(--card)}
  .transpose button{border:0;background:none;height:40px;width:40px;font-size:18px;cursor:pointer;color:var(--ink)}
  .transpose .val{min-width:52px;text-align:center;font-weight:700;font-size:15px}
  .hint{font-size:12.5px;color:var(--muted);margin:2px 0 0}
  .diagrams{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
  .dg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px 4px;
    text-align:center;min-width:82px}
  .dg .name{font-weight:700;font-size:13px;margin-bottom:2px;color:var(--green)}
  .dg svg{display:block;margin:0 auto}
  .lyrics{
    font-family:Georgia,"Times New Roman",serif;font-size:var(--lyrics-size);
    line-height:1.55;margin:14px 0 0;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:18px 18px 22px;box-shadow:var(--shadow);
  }
  .ln{margin:0 0 14px;display:flex;flex-wrap:wrap}
  .chunk{display:inline-flex;flex-direction:column;margin-right:2px}
  .chunk .ch{font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px;font-weight:800;
    color:var(--accent);height:16px;line-height:16px;letter-spacing:.2px}
  .chunk .tx{white-space:pre}
  .ln.instr{color:var(--muted);font-style:italic;font-size:.9em}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 8px}
  @media (max-width:520px){
    .lyrics{font-size:calc(var(--lyrics-size) - 1px);padding:16px 14px 18px}
    .song-head h2{font-size:22px}
  }
  @media print{
    header,.toolbar,.back,.diagrams,footer{display:none!important}
    body{background:#fff}
    .lyrics{border:0;box-shadow:none}
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>🎵 Zpěvník <span>říkanek</span></h1>
    <button class="icon-btn" id="randomBtn" title="Náhodná písnička">🎲</button>
    <button class="icon-btn" id="favBtn" title="Jen oblíbené">★</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Hledat písničku…" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="list-wrap" id="listWrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Nic jsem nenašel. Zkus jiné slovo.</div>
    <footer><span id="songCount"></span> písniček · akordy pro kytaru · transpozice a kapodastr</footer>
  </div>

  <div class="detail" id="detail">
    <button class="icon-btn back" id="backBtn">← Zpět na seznam</button>
    <div class="song-head">
      <div style="flex:1">
        <h2 id="dTitle">—</h2>
        <div class="song-sub" id="dSub"></div>
      </div>
      <button class="fav" id="dFav" style="position:static;font-size:24px">☆</button>
    </div>

    <div class="toolbar">
      <div class="transpose">
        <button id="trDown" title="O půltón níž">−</button>
        <span class="val" id="trVal">0</span>
        <button id="trUp" title="O půltón výš">+</button>
      </div>
      <button class="icon-btn" id="fontDown">A−</button>
      <button class="icon-btn" id="fontUp">A+</button>
      <button class="icon-btn" id="printBtn">🖨 Tisk</button>
    </div>
    <p class="hint" id="capoHint"></p>

    <div class="diagrams" id="diagrams"></div>
    <div class="lyrics" id="lyrics"></div>
  </div>
</main>

<script src="data/songs.js"></script>
<script>
(function(){
  "use strict";

  var CATS = {zvirata:"Zvířata", lidove:"Lidové", ukolebavky:"Ukolébavky", hry:"Hry a tance", taborove:"Táborovky", zahranicni:"Zahraniční"};
  var NOTE_NAMES = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","H"]; // H = B natural, Bb = B
  var SEMI = {C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:10,H:11};
  var CHORD_RE = /\[([A-H](?:#|b)?(?:m7|maj7|m|7|dim|sus4)?)\]/g;

  var state = {
    q:"", cat:"all", favOnly:false, current:null, transpose:0,
    favs: JSON.parse(localStorage.getItem("zp-favs")||"[]"),
    font: parseInt(localStorage.getItem("zp-font")||"20",10)
  };
  document.documentElement.style.setProperty("--lyrics-size", state.font+"px");

  var $ = function(id){ return document.getElementById(id); };
  function norm(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }

  function parseChords(line){
    var out=[], m, last=0;
    CHORD_RE.lastIndex=0;
    while((m=CHORD_RE.exec(line))){
      if(m.index>last) out.push({ch:null,text:line.slice(last,m.index)});
      out.push({ch:m[1],text:""});
      last=m.index+m[0].length;
    }
    if(last<line.length) out.push({ch:null,text:line.slice(last)});
    // chord applies to following text chunk
    var res=[];
    for(var i=0;i<out.length;i++){
      var c=out[i];
      if(c.ch!==null){
        var txt = (i+1<out.length && out[i+1].ch===null) ? out[i+1].text : "";
        res.push({ch:c.ch,text:txt});
        if(txt) i++;
      } else if(c.text) res.push({ch:null,text:c.text});
    }
    return res;
  }

  function songChords(song){
    var set=[];
    song.lines.forEach(function(l){
      var m,re=new RegExp(CHORD_RE.source,"g");
      while((m=re.exec(l))) if(set.indexOf(m[1])<0) set.push(m[1]);
    });
    return set;
  }
  function firstLine(song){
    return song.lines[0].replace(CHORD_RE,"").replace(/\s+/g," ").trim();
  }

  function transposeChord(name, n){
    var m = name.match(/^([A-H](?:#|b)?)(.*)$/);
    if(!m) return name;
    var pc = (SEMI[m[1]] + n) % 12; if(pc<0) pc+=12;
    return NOTE_NAMES[pc] + m[2];
  }

  /* ---- chord diagrams ---- */
  function chordParts(name){
    var m = name.match(/^([A-H](?:#|b)?)(.*)$/);
    if(!m) return null;
    var root = (m[1] === "B") ? "Bb" : m[1]; // B alone = Bb in Czech usage
    var pc = SEMI[root]; if(pc===undefined) return null;
    var q = m[2]||"";
    return {pc:pc, q:q};
  }

  var SHAPES = {
    "":   {E:[0,2,2,1,0,0], A:[null,0,2,2,2,0]},
    "m":  {E:[0,2,2,0,0,0], A:[null,0,2,2,1,0]},
    "7":  {E:[0,2,0,1,0,0], A:[null,0,2,0,2,0]},
    "m7": {E:[0,2,0,0,0,0], A:[null,0,2,0,1,0]},
    "maj7":{E:[0,2,1,1,0,0],A:[null,0,2,1,2,0]}
  };

  function computeShape(name){
    var p = chordParts(name); if(!p) return null;
    var q = SHAPES[p.q] ? p.q : "";
    var eOpen = (p.pc - 4 + 12) % 12;   // fret on 6th string, 0 = open E
    var aOpen = (p.pc - 9 + 12) % 12;   // fret on 5th string, 0 = open A
    var useE, base;
    if(eOpen === 0){ useE = true; base = 0; }
    else if(aOpen === 0){ useE = false; base = 0; }
    else if(aOpen <= 5){ useE = false; base = aOpen; }
    else { useE = true; base = eOpen; }

    var template = SHAPES[q][useE ? "E" : "A"];
    var frets = template.map(function(f){
      if(f === null) return -1;
      return f === 0 ? 0 : f + base;
    });
    if(base === 0){
      // open position — template already in open frets
      frets = template.map(function(f){ return f===null?-1:f; });
    }
    return {frets:frets, base:base, useE:useE};
  }

  function svgDiagram(name, size){
    size = size || 108;
    var shape = computeShape(name);
    var W=size, H=size*1.03;
    var left=13, right=W-10, top=20, bottom=H-12;
    var strings=6, frets=5;
    var dx=(right-left)/(strings-1), dy=(bottom-top)/frets;
    var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-label="Akord '+name+'">';
    s+='<rect width="'+W+'" height="'+H+'" fill="none"/>';
    // nut
    s+='<line x1="'+left+'" y1="'+top+'" x2="'+right+'" y2="'+top+'" stroke="#2b2118" stroke-width="'+(shape&&shape.base===0?3:1.2)+'"/>';
    for(var f=1;f<=frets;f++){
      var y=top+f*dy;
      s+='<line x1="'+left+'" y1="'+y+'" x2="'+right+'" y2="'+y+'" stroke="#c9b6a2" stroke-width="1"/>';
    }
    for(var i=0;i<strings;i++){
      var x=left+i*dx;
      s+='<line x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+bottom+'" stroke="#c9b6a2" stroke-width="1"/>';
    }
    if(!shape){ s+='<text x="'+W/2+'" y="'+H/2+'" text-anchor="middle" font-size="16" fill="#8a7460">?</text></svg>'; return s; }
    var base = shape.base;
    var pos = shape.frets.map(function(f){ return f<0?-1:(base===0?f:f-base); });
    // barre detection: same fret repeated >=2 on low strings
    var barre = -1;
    var counts={};
    pos.forEach(function(f){ if(f>0) counts[f]=(counts[f]||0)+1; });
    Object.keys(counts).forEach(function(k){ if(counts[k]>=3 && barre<0) barre=parseInt(k,10); });
    for(var sIdx=0;sIdx<strings;sIdx++){
      var fr=pos[sIdx], x=left+sIdx*dx;
      if(fr<0){ s+='<text x="'+x+'" y="'+(top-7)+'" text-anchor="middle" font-size="9" fill="#8a7460">×</text>'; continue; }
      if(fr===0){ s+='<circle cx="'+x+'" cy="'+(top-8)+'" r="3.2" fill="none" stroke="#2b2118" stroke-width="1.3"/>'; continue; }
      if(fr===barre && counts[fr]>=3){
        // draw barre once
        if(sIdx===0 || pos[sIdx-1]!==barre){
          var endIdx=sIdx; for(var j=sIdx;j<strings;j++) if(pos[j]===barre) endIdx=j;
          var x2=left+endIdx*dx;
          s+='<rect x="'+(x-4)+'" y="'+(top+(fr-1)*dy+dy/2-4.5)+'" width="'+(x2-x+8)+'" height="9" rx="4.5" fill="#b4532a"/>';
        }
      } else {
        s+='<circle cx="'+x+'" cy="'+(top+(fr-1)*dy+dy/2)+'" r="4.6" fill="#b4532a"/>';
      }
    }
    if(base>0) s+='<text x="'+(left-7)+'" y="'+(top+dy*0.8)+'" text-anchor="end" font-size="10" fill="#8a7460">'+base+'</text>';
    s+='</svg>';
    return s;
  }

  /* ---- list ---- */
  function renderChips(){
    var items=[["all","Vše"]].concat(Object.keys(CATS).map(function(k){return [k,CATS[k]];}));
    $("chips").innerHTML = items.map(function(it){
      return '<button class="chip'+(state.cat===it[0]?" on":"")+'" data-cat="'+it[0]+'">'+it[1]+'</button>';
    }).join("") + '<button class="chip'+(state.favOnly?" on":"")+'" data-fav="1">★ Oblíbené</button>';
  }

  function filtered(){
    var q=norm(state.q);
    return window.SONGS.filter(function(s){
      if(state.cat!=="all" && s.cat!==state.cat) return false;
      if(state.favOnly && state.favs.indexOf(s.id)<0) return false;
      if(!q) return true;
      return norm(s.title).indexOf(q)>=0 || norm(s.lines.join(" ")).indexOf(q)>=0;
    });
  }

  function renderList(){
    var list=filtered();
    $("empty").style.display = list.length ? "none":"block";
    $("grid").innerHTML = list.map(function(s){
      var ch=songChords(s);
      return '<article class="card" data-id="'+s.id+'">'+
        '<button class="fav '+(state.favs.indexOf(s.id)>=0?"on":"")+'" data-fav-id="'+s.id+'" aria-label="Oblíbené">'+
          (state.favs.indexOf(s.id)>=0?"★":"☆")+'</button>'+
        '<h3>'+s.title+'</h3>'+
        '<div class="first">'+firstLine(s)+'</div>'+
        '<div class="meta"><span class="tag">'+CATS[s.cat]+'</span>'+
        '<span class="song-chords">'+ch.slice(0,4).map(function(c){return "<b>"+c+"</b>";}).join("")+'</span></div>'+
      '</article>';
    }).join("");
  }

  /* ---- detail ---- */
  function openSong(id, push){
    var song = window.SONGS.filter(function(s){return s.id===id;})[0];
    if(!song) return;
    state.current = song; state.transpose = 0;
    if(push!==false) location.hash = "#/"+id;
    $("listWrap").classList.add("hidden");
    $("detail").classList.add("open");
    window.scrollTo({top:0,behavior:"instant"});
    renderDetail();
  }
  function closeSong(push){
    state.current=null;
    if(push!==false) location.hash = "";
    $("detail").classList.remove("open");
    $("listWrap").classList.remove("hidden");
  }
  function transName(c){ return state.transpose ? transposeChord(c,state.transpose) : c; }

  function renderDetail(){
    var s=state.current; if(!s) return;
    $("dTitle").textContent = s.title;
    $("dSub").textContent = CATS[s.cat] + " · tónina " + s.key;
    $("trVal").textContent = (state.transpose>0?"+":"") + state.transpose;
    var fav = state.favs.indexOf(s.id)>=0;
    $("dFav").textContent = fav ? "★" : "☆";
    $("dFav").classList.toggle("on", fav);

    if(state.transpose===0){
      $("capoHint").textContent = "Akordy v původní tónině.";
    } else if(state.transpose<0){
      $("capoHint").textContent = "Transponováno o "+Math.abs(state.transpose)+" půltón"+(Math.abs(state.transpose)>1?"y":"")+" níž. Nebo hraj původní akordy s kapodastrem na "+Math.abs(state.transpose)+". pražci.";
    } else {
      $("capoHint").textContent = "Transponováno o "+state.transpose+" půltón"+(state.transpose>1?"y":"")+" výš.";
    }

    var chords = songChords(s).map(transName);
    $("diagrams").innerHTML = chords.map(function(c){
      return '<div class="dg"><div class="name">'+c+'</div>'+svgDiagram(c,104)+'</div>';
    }).join("");

    $("lyrics").innerHTML = s.lines.map(function(line){
      var chunks = parseChords(line);
      var html = chunks.map(function(c){
        if(c.ch===null) return '<span class="chunk"><span class="ch">&nbsp;</span><span class="tx">'+esc(c.text)+'</span></span>';
        return '<span class="chunk"><span class="ch">'+transName(c.ch)+'</span><span class="tx">'+esc(c.text||"\u00a0")+'</span></span>';
      }).join("");
      return '<p class="ln">'+html+'</p>';
    }).join("");
  }
  function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  /* ---- events ---- */
  $("q").addEventListener("input", function(e){ state.q=e.target.value; renderList(); });
  $("chips").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.fav){ state.favOnly=!state.favOnly; }
    else if(b.dataset.cat){ state.cat=b.dataset.cat; }
    renderChips(); renderList();
  });
  $("grid").addEventListener("click", function(e){
    var favBtn=e.target.closest("[data-fav-id]");
    if(favBtn){ e.stopPropagation(); toggleFav(favBtn.dataset.favId); return; }
    var card=e.target.closest("[data-id]"); if(card) openSong(card.dataset.id);
  });
  $("favBtn").addEventListener("click", function(){ state.favOnly=!state.favOnly; renderChips(); renderList(); });
  $("randomBtn").addEventListener("click", function(){
    var l=window.SONGS; var s=l[Math.floor(Math.random()*l.length)]; openSong(s.id);
  });
  $("backBtn").addEventListener("click", function(){ closeSong(); });
  $("trUp").addEventListener("click", function(){ if(state.transpose<11){state.transpose++; renderDetail();} });
  $("trDown").addEventListener("click", function(){ if(state.transpose>-11){state.transpose--; renderDetail();} });
  $("dFav").addEventListener("click", function(){ toggleFav(state.current.id); renderDetail(); });
  $("fontUp").addEventListener("click", function(){ setFont(state.font+2); });
  $("fontDown").addEventListener("click", function(){ setFont(state.font-2); });
  $("printBtn").addEventListener("click", function(){ window.print(); });
  window.addEventListener("hashchange", route);

  function setFont(px){
    state.font=Math.max(14,Math.min(40,px));
    document.documentElement.style.setProperty("--lyrics-size", state.font+"px");
    localStorage.setItem("zp-font", state.font);
  }
  function toggleFav(id){
    var i=state.favs.indexOf(id);
    if(i>=0) state.favs.splice(i,1); else state.favs.push(id);
    localStorage.setItem("zp-favs", JSON.stringify(state.favs));
    renderList();
  }
  function route(){
    var m=location.hash.match(/^#\/(.+)$/);
    if(m) openSong(m[1], false); else closeSong(false);
    renderList();
  }

  renderChips(); renderList(); route();
  $("songCount").textContent = window.SONGS.length;
  if("serviceWorker" in navigator && location.pathname.indexOf("/api/hassio_ingress/") !== 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
